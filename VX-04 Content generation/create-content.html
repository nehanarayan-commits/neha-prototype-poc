<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Commerce Visibility — Content</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --color-background-primary:#FFFFFF;
  --color-background-secondary:#F7F8FA;
  --color-background-tertiary:#F0F2F5;
  --color-text-primary:rgba(0,0,0,0.87);
  --color-text-secondary:rgba(0,0,0,0.55);
  --color-text-tertiary:rgba(0,0,0,0.35);
  --color-border-tertiary:rgba(0,0,0,0.10);
  --color-border-secondary:rgba(0,0,0,0.20);
  --coral:#D85A30;
  --link-blue:#185FA5;
  --dark-navy:#1A2752;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:14px;
  color:var(--color-text-primary);
  display:flex;flex-direction:column;min-height:100vh;min-width:1440px;
  background:var(--color-background-tertiary);
}
/* TOPBAR */
.topbar{
  height:48px;background:var(--color-background-primary);
  border-bottom:1px solid var(--color-border-tertiary);
  display:flex;align-items:center;padding:0 24px;gap:12px;
  position:sticky;top:0;z-index:100;flex-shrink:0;
}
.topbar-logo{
  width:28px;height:28px;background:var(--dark-navy);border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:11px;font-weight:700;letter-spacing:-0.5px;flex-shrink:0;
}
.topbar-title{font-size:14px;font-weight:600;color:var(--color-text-primary)}
.topbar-badge{
  background:#E1F5EE;color:#085041;font-size:11px;font-weight:500;
  padding:2px 8px;border-radius:20px;
}
.topbar-spacer{flex:1}
.topbar-avatar{
  width:32px;height:32px;border-radius:50%;background:var(--dark-navy);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:12px;font-weight:600;cursor:pointer;
}
/* NAV TABS */
.nav-tabs{
  background:var(--color-background-primary);
  border-bottom:1px solid var(--color-border-tertiary);
  display:flex;padding:0 24px;gap:0;flex-shrink:0;
}
.nav-tab{
  padding:12px 16px;font-size:13px;font-weight:500;color:var(--color-text-secondary);
  cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;
  transition:color 0.15s;user-select:none;
}
.nav-tab:hover{color:var(--color-text-primary)}
.nav-tab.active{color:var(--coral);border-bottom-color:var(--coral)}
/* MAIN CONTENT AREA */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
/* VIEW CONTAINERS */
.view{display:none;flex:1;flex-direction:column;overflow:hidden}
.view.active{display:flex}
/* LIBRARY VIEW */
.library-header{
  padding:20px 24px 0;display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.library-title{font-size:16px;font-weight:500}
.library-count{font-size:13px;color:var(--color-text-secondary);margin-left:8px}
.preview-toggle-group{display:flex;border:1px solid var(--color-border-secondary);border-radius:6px;overflow:hidden}
.preview-toggle{padding:4px 12px;font-size:12px;font-weight:500;font-family:inherit;border:none;background:#fff;color:var(--color-text-secondary);cursor:pointer;transition:background 0.12s,color 0.12s}
.preview-toggle.active{background:var(--color-background-secondary);color:var(--color-text-primary);font-weight:600}
.preview-pane{border:1px solid var(--color-border-secondary);border-radius:6px;padding:14px;min-height:300px;overflow-y:auto}
.lib-search-wrap{position:relative;display:flex;align-items:center}
.lib-search-icon{position:absolute;left:9px;pointer-events:none}
.lib-search-input{height:34px;width:280px;padding:0 10px 0 30px;border:1px solid var(--color-border-secondary);border-radius:6px;font-size:13px;font-family:inherit;color:var(--color-text-primary);background:var(--color-background-secondary);outline:none;transition:border-color 0.15s}
.lib-search-input::placeholder{color:var(--color-text-tertiary)}
.lib-search-input:focus{border-color:var(--coral)}
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 14px;border-radius:6px;font-size:13px;font-weight:500;
  cursor:pointer;border:none;transition:opacity 0.15s;line-height:1;
}
.btn:disabled{opacity:0.45;cursor:not-allowed}
.btn-coral{background:var(--coral);color:#fff}
.btn-coral:hover:not(:disabled){opacity:0.88}
.btn-outline{background:#fff;color:var(--color-text-primary);border:1px solid var(--color-border-secondary)}
.btn-outline:hover:not(:disabled){background:var(--color-background-secondary)}
.btn-ghost{background:transparent;color:var(--link-blue);padding:4px 8px;font-size:12px}
.btn-ghost:hover{background:var(--color-background-secondary)}
.btn-sm{padding:4px 10px;font-size:12px}
/* FILTER PILLS */
.filter-pills{
  padding:12px 24px 0;display:flex;gap:8px;flex-shrink:0;
}
.filter-pill{
  padding:5px 14px;border-radius:20px;font-size:12px;font-weight:500;
  cursor:pointer;border:1px solid var(--color-border-tertiary);
  background:#fff;color:var(--color-text-secondary);transition:all 0.15s;
}
.filter-pill.active{background:var(--dark-navy);color:#fff;border-color:var(--dark-navy)}
/* LIBRARY LIST */
.library-list{
  padding:12px 24px 24px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:0;
}
.list-empty{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;padding:60px 0;
}
.list-empty-icon{
  width:64px;height:64px;border-radius:50%;background:var(--color-background-tertiary);
  display:flex;align-items:center;justify-content:center;font-size:28px;
}
.list-empty h3{font-size:15px;font-weight:500;color:var(--color-text-primary)}
.list-empty p{font-size:13px;color:var(--color-text-secondary)}
/* LIST ITEM */
.list-item{
  background:#fff;border:1px solid var(--color-border-tertiary);
  border-radius:8px;margin-bottom:8px;overflow:hidden;
  border-left:4px solid transparent;transition:box-shadow 0.15s;
}
.list-item:hover{box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.list-item.status-approved{border-left-color:#5DCAA5}
.list-item.status-published{border-left-color:#B3D4FF}
.list-item-main{
  display:flex;align-items:flex-start;gap:12px;padding:14px 14px 10px 14px;
}
.list-item-body{flex:1;min-width:0}
.list-item-title-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.list-item-title{font-size:13px;font-weight:500;color:var(--color-text-primary)}
.meta-tag{
  padding:2px 8px;border-radius:20px;font-size:11px;
  background:var(--color-background-tertiary);color:var(--color-text-secondary);
}
.list-item-excerpt{
  font-size:12px;color:var(--color-text-secondary);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:700px;
  margin-bottom:8px;
}
.version-toggle{
  display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--link-blue);
  cursor:pointer;user-select:none;padding:0;background:none;border:none;
}
.version-toggle:hover{text-decoration:underline}
.list-item-right{
  display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;
}
.list-item-date{font-size:11px;color:var(--color-text-tertiary)}
.status-badge{
  padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500;
}
.badge-draft{background:#F4F5F7;color:#494949}
.badge-approved{background:#E1F5EE;color:#085041}
.badge-published{background:#EBF3FF;color:#0052CC}
/* VERSION HISTORY (inline) */
.version-history-panel{
  border-top:1px solid var(--color-border-tertiary);
  background:var(--color-background-secondary);
  padding:10px 14px;
  display:none;
}
.version-history-panel.open{display:block}
.version-row{
  display:flex;align-items:center;gap:10px;padding:6px 0;
  border-bottom:1px solid var(--color-border-tertiary);font-size:12px;
}
.version-row:last-child{border-bottom:none}
.version-num{font-weight:600;color:var(--dark-navy);min-width:24px}
.version-date{color:var(--color-text-secondary);min-width:90px}
.version-note{color:var(--color-text-primary);flex:1}
.version-actions{display:flex;gap:6px}
/* DETAIL VIEW */
.detail-header{
  background:#fff;border-bottom:1px solid var(--color-border-tertiary);
  padding:12px 24px;display:flex;align-items:center;gap:12px;flex-shrink:0;
}
.back-link{
  display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--link-blue);
  cursor:pointer;text-decoration:none;background:none;border:none;padding:0;
}
.back-link:hover{text-decoration:underline}
.detail-title{font-size:15px;font-weight:600;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.detail-body{
  flex:1;display:flex;overflow:hidden;padding:16px 24px;gap:16px;
}
.detail-col-brief{
  width:220px;flex-shrink:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;
}
.detail-col-content{
  flex:1;min-width:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;
}
.detail-col-right{
  width:220px;flex-shrink:0;border-left:1px solid var(--color-border-tertiary);
  padding-left:16px;overflow-y:auto;
}
.card{
  background:#fff;border:1px solid var(--color-border-tertiary);
  border-radius:8px;padding:16px;
}
.card-label{
  font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;
  color:var(--color-text-tertiary);margin-bottom:10px;
}
.brief-text{font-size:13px;color:var(--color-text-secondary);line-height:1.6}
.article-content{font-size:14px;line-height:1.7;color:var(--color-text-primary)}
.article-content h1{font-size:20px;font-weight:700;margin-bottom:16px;color:var(--dark-navy)}
.article-content h2{font-size:16px;font-weight:600;margin:20px 0 10px;color:var(--color-text-primary)}
.article-content p{margin-bottom:12px}
.article-content ul{padding-left:20px;margin-bottom:12px}
.article-content li{margin-bottom:4px}
.article-content strong{font-weight:600}
.article-content em{font-style:italic}
.article-content table{width:100%;border-collapse:collapse;margin-bottom:12px}
.article-content th,.article-content td{border:1px solid var(--color-border-tertiary);padding:6px 10px;text-align:left}
.article-content th{background:var(--color-background-secondary);font-weight:600}
.content-textarea{
  width:100%;min-height:320px;border:1px solid var(--color-border-secondary);
  border-radius:6px;padding:12px;font-family:inherit;font-size:14px;
  line-height:1.7;resize:vertical;color:var(--color-text-primary);
}
.content-textarea:focus{outline:none;border-color:var(--link-blue)}
.refine-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.refine-pill{
  padding:5px 12px;border-radius:20px;font-size:12px;font-weight:500;
  background:var(--color-background-secondary);border:1px solid var(--color-border-secondary);
  color:var(--color-text-secondary);cursor:pointer;transition:all 0.15s;
}
.refine-pill:hover{background:#FEF0EB;border-color:var(--coral);color:var(--coral)}
.custom-refine{display:flex;gap:8px;margin-top:10px}
.custom-refine input{
  flex:1;border:1px solid var(--color-border-secondary);border-radius:6px;
  padding:6px 10px;font-family:inherit;font-size:13px;
}
.custom-refine input:focus{outline:none;border-color:var(--link-blue)}
/* VERSION SIDEBAR */
.version-sidebar-title{font-size:13px;font-weight:600;margin-bottom:12px;color:var(--color-text-primary)}
.version-sidebar-item{
  padding:8px 0;border-bottom:1px solid var(--color-border-tertiary);cursor:pointer;
}
.version-sidebar-item:last-child{border-bottom:none}
.version-sidebar-item.active .vs-num{color:var(--coral)}
.vs-num{font-size:12px;font-weight:600;color:var(--color-text-secondary);display:flex;align-items:center;gap:6px}
.vs-dot{width:8px;height:8px;border-radius:50%;background:var(--color-border-secondary);flex-shrink:0}
.vs-dot.current{background:var(--coral)}
.vs-date{font-size:11px;color:var(--color-text-tertiary);margin-top:2px;margin-left:14px}
.vs-note{font-size:12px;color:var(--color-text-secondary);margin-top:2px;margin-left:14px}
/* MODAL */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,0.55);
  display:none;align-items:center;justify-content:center;z-index:200;
}
.modal-backdrop.open{display:flex}
.modal{
  background:#fff;border-radius:12px;
  box-shadow:0 20px 60px rgba(0,0,0,0.3);
  width:100%;max-width:1040px;
  height:82vh;display:flex;flex-direction:column;
  position:relative;overflow:hidden;
}
.modal-close{
  position:absolute;top:14px;right:16px;
  background:none;border:none;font-size:20px;cursor:pointer;
  color:var(--color-text-secondary);line-height:1;z-index:1;
  width:28px;height:28px;display:flex;align-items:center;justify-content:center;
  border-radius:4px;
}
.modal-close:hover{background:var(--color-background-secondary);color:var(--color-text-primary)}
.modal-header{
  padding:20px 48px 0 24px;flex-shrink:0;
  border-bottom:1px solid var(--color-border-tertiary);
}
.modal-header-title{font-size:16px;font-weight:600;margin-bottom:14px}
.step-pills{display:flex;gap:0;overflow-x:auto;padding-bottom:0}
.step-pill{
  padding:8px 14px;font-size:12px;font-weight:500;color:var(--color-text-tertiary);
  border-bottom:2px solid transparent;white-space:nowrap;cursor:default;
  display:flex;align-items:center;gap:6px;margin-bottom:-1px;
}
.step-pill.active{color:var(--coral);border-bottom-color:var(--coral)}
.step-pill.done{color:var(--color-text-secondary)}
.step-num{
  width:18px;height:18px;border-radius:50%;background:var(--color-background-tertiary);
  display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;
  color:var(--color-text-tertiary);flex-shrink:0;
}
.step-pill.active .step-num{background:var(--coral);color:#fff}
.step-pill.done .step-num{background:#5DCAA5;color:#fff}
.modal-body{flex:1;overflow-y:auto;padding:20px 24px}
.modal-footer{
  padding:14px 24px;border-top:1px solid var(--color-border-tertiary);
  display:flex;align-items:center;gap:10px;flex-shrink:0;
}
.modal-footer-spacer{flex:1}
/* FORM ELEMENTS */
.form-group{margin-bottom:16px}
.form-label{font-size:12px;font-weight:500;color:var(--color-text-secondary);margin-bottom:6px;display:block}
.modal-select{width:100%;height:36px;padding:0 28px 0 10px;border-radius:8px;border:1px solid var(--color-border-secondary);background:var(--color-background-secondary);font-size:13px;color:var(--color-text-primary);font-family:inherit;cursor:pointer;appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%23999' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 10px center;background-color:var(--color-background-secondary);}
.modal-select:focus{outline:none;border-color:var(--coral);}
.modal-select option[value=""]{color:var(--color-text-tertiary);}
/* MULTI-SEARCH */
.ms-wrap{position:relative}
.ms-input-area{
  min-height:36px;border:1px solid var(--color-border-secondary);border-radius:6px;
  padding:4px 8px;display:flex;flex-wrap:wrap;align-items:center;gap:4px;
  cursor:text;background:#fff;transition:border-color 0.15s;
}
.ms-input-area:focus-within{border-color:var(--link-blue)}
.ms-tag{
  display:inline-flex;align-items:center;gap:4px;padding:2px 8px;
  background:#FEF0EB;border:1px solid #F4C4AE;border-radius:20px;
  font-size:12px;color:var(--coral);
}
.ms-tag-x{
  background:none;border:none;cursor:pointer;color:var(--coral);
  font-size:14px;line-height:1;padding:0;display:flex;align-items:center;
}
.ms-search{
  border:none;outline:none;font-size:13px;font-family:inherit;
  flex:1;min-width:80px;padding:2px 4px;background:transparent;
}
.ms-dropdown{
  position:absolute;top:calc(100% + 4px);left:0;right:0;
  background:#fff;border:1px solid var(--color-border-secondary);
  border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,0.12);
  max-height:180px;overflow-y:auto;z-index:300;display:none;
}
.ms-dropdown.open{display:block}
.ms-option{
  padding:8px 12px;font-size:13px;cursor:pointer;color:var(--color-text-primary);
  transition:background 0.1s;display:flex;align-items:center;gap:8px;
}
.ms-option:hover{background:var(--color-background-secondary)}
.ms-option.selected{color:var(--coral)}
.ms-option-check{width:14px;height:14px;border-radius:3px;border:1px solid var(--color-border-secondary);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px}
.ms-option.selected .ms-option-check{background:var(--coral);border-color:var(--coral);color:#fff}
.ms-empty{padding:10px 12px;font-size:12px;color:var(--color-text-tertiary)}
/* STEP 3 PROMPTS */
.prompts-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.prompts-count{font-size:13px;color:var(--color-text-secondary)}
.prompt-row{
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  border:1px solid var(--color-border-tertiary);border-radius:6px;
  margin-bottom:6px;cursor:pointer;transition:all 0.15s;
}
.prompt-row:hover{background:var(--color-background-secondary)}
.prompt-row.selected{background:#FFF8F5;border-color:#F4C4AE}
.prompt-cb{
  width:16px;height:16px;border-radius:4px;border:1.5px solid var(--color-border-secondary);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all 0.15s;
}
.prompt-row.selected .prompt-cb{background:var(--coral);border-color:var(--coral);color:#fff;font-size:10px}
.prompt-text{flex:1;font-size:13px;color:var(--color-text-primary)}
.mini-bars{display:flex;flex-direction:column;gap:4px;width:140px;flex-shrink:0}
.mini-bar-row{display:flex;align-items:center;gap:6px}
.mini-bar-label{font-size:10px;color:var(--color-text-tertiary);width:28px;text-align:right}
.mini-bar-track{height:6px;background:var(--color-background-tertiary);border-radius:3px;flex:1;position:relative;overflow:hidden}
.mini-bar-fill{height:100%;border-radius:3px;position:absolute;top:0;left:0}
.mini-bar-val{font-size:10px;color:var(--color-text-secondary);width:28px}
.gap-badge{
  padding:2px 7px;border-radius:20px;font-size:11px;font-weight:600;flex-shrink:0;
}
.gap-red{background:#FCEBEB;color:#791F1F}
.gap-amber{background:#FAEEDA;color:#633806}
.gap-green{background:#E1F5EE;color:#085041}
/* STEP 4 CITATIONS */
.opp-banner{
  background:#FFF8F5;border:1px solid #F4C4AE;border-radius:8px;
  padding:10px 14px;margin-bottom:16px;font-size:13px;color:var(--coral);
}
.citation-group{
  border:1px solid var(--color-border-tertiary);border-radius:8px;margin-bottom:10px;overflow:hidden;
}
.citation-group-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;background:var(--color-background-secondary);cursor:pointer;
}
.citation-group-prompt{font-size:13px;font-weight:500;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;margin-right:10px}
.citation-group-count{font-size:12px;color:var(--color-text-secondary);flex-shrink:0;margin-right:8px}
.citation-group-chevron{color:var(--color-text-tertiary);flex-shrink:0;transition:transform 0.2s}
.citation-group.collapsed .citation-group-chevron{transform:rotate(-90deg)}
.citation-items{padding:0}
.citation-item{
  display:flex;align-items:flex-start;gap:10px;padding:10px 14px;
  border-top:1px solid var(--color-border-tertiary);transition:background 0.15s;cursor:pointer;
}
.citation-item:hover{background:var(--color-background-secondary)}
.citation-item.selected{background:#FFF8F5}
.citation-cb{
  width:16px;height:16px;border-radius:4px;border:1.5px solid var(--color-border-secondary);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:2px;
}
.citation-item.selected .citation-cb{background:var(--coral);border-color:var(--coral);color:#fff;font-size:10px}
.favicon-circle{
  width:28px;height:28px;border-radius:50%;background:var(--dark-navy);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;
  flex-shrink:0;
}
.citation-body{flex:1;min-width:0}
.citation-domain{font-size:12px;font-weight:600;color:var(--color-text-primary);margin-bottom:3px}
.citation-snippet{font-size:12px;color:var(--color-text-secondary);line-height:1.5;margin-bottom:6px}
.llm-badges{display:flex;gap:4px;flex-wrap:wrap}
.llm-badge{padding:2px 7px;border-radius:20px;font-size:10px;font-weight:600}

function markdownToHtml(md) {
  if (!md) return '';
  var lines = md.split('\n');
  var html = '';
  var inUl = false;
  var i = 0;
  while (i < lines.length) {
    var line = lines[i];
    if (line.match(/^\|/) && i+1 < lines.length && lines[i+1].match(/^\|[\s\-|]+\|/)) {
      if (inUl) { html += '</ul>'; inUl = false; }
      var headers = line.split('|').filter(function(c){return c.trim()!==''}).map(function(c){return '<th>'+inlineMarkdown(c.trim())+'</th>';});
      html += '<table><thead><tr>'+headers.join('')+'</tr></thead><tbody>';
      i += 2;
      while (i < lines.length && lines[i].match(/^\|/)) {
        var cells = lines[i].split('|').filter(function(c){return c.trim()!==''}).map(function(c){return '<td>'+inlineMarkdown(c.trim())+'</td>';});
        html += '<tr>'+cells.join('')+'</tr>';
        i++;
      }
      html += '</tbody></table>';
      continue;
    }
    if (line.match(/^# /)) {
      if (inUl) { html += '</ul>'; inUl = false; }
      html += '<h1>'+inlineMarkdown(line.replace(/^# /,''))+'</h1>';
    } else if (line.match(/^## /)) {
      if (inUl) { html += '</ul>'; inUl = false; }
      html += '<h2>'+inlineMarkdown(line.replace(/^## /,''))+'</h2>';
    } else if (line.match(/^### /)) {
      if (inUl) { html += '</ul>'; inUl = false; }
      html += '<h3>'+inlineMarkdown(line.replace(/^### /,''))+'</h3>';
    } else if (line.match(/^[-*] /)) {
      if (!inUl) { html += '<ul>'; inUl = true; }
      html += '<li>'+inlineMarkdown(line.replace(/^[-*] /,''))+'</li>';
    } else if (line.trim() === '') {
      if (inUl) { html += '</ul>'; inUl = false; }
    } else {
      if (inUl) { html += '</ul>'; inUl = false; }
      html += '<p>'+inlineMarkdown(line)+'</p>';
    }
    i++;
  }
  if (inUl) html += '</ul>';
  return html;
}

function inlineMarkdown(text) {
  return text
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/`(.+?)`/g, '<code>$1</code>');
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function showToast(msg, type) {
  var container = type === 'success'
    ? document.getElementById('toast-container-top')
    : document.getElementById('toast-container');
  var el = document.createElement('div');
  el.className = 'toast' + (type === 'success' ? ' toast--success' : '');
  el.textContent = msg;
  container.appendChild(el);
  setTimeout(function() {
    el.style.opacity = '0';
    el.style.transition = 'opacity 0.3s';
    setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 300);
  }, 2200);
}

}

    if (!q) return true;
    return a.title.toLowerCase().indexOf(q) !== -1 ||
      (a.format||'').toLowerCase().indexOf(q) !== -1 ||
      a.categories.join(' ').toLowerCase().indexOf(q) !== -1;
  });
}

function renderLibrary() {

function renderVersionPanel(article) {

      '<span class="version-num">v'+ver.v+'</span>' +
      '<span class="version-date">'+escapeHtml(ver.date)+'</span>' +

      '<div class="version-actions">' +
        '<button class="btn btn-ghost btn-sm btn-ver-view" data-id="'+article.id+'" data-v="'+ver.v+'">View</button>' +

function findArticle(id) {
  for(var i=0;i<library.length;i++){if(library[i].id===id)return library[i];}
  return null;
}

function openDetail(articleId, versionNum) {
  var article = findArticle(articleId);
  if (!article) return;
  currentDetailId = articleId;
  isEditing = false;
  var vIdx = article.versions.length - 1;
  if (versionNum !== undefined) {
    for(var i=0;i<article.versions.length;i++){
      if(article.versions[i].v===versionNum){vIdx=i;break;}
    }
  }
  currentDetailVersion = vIdx;
  renderDetailView(article, vIdx);
  showView('detail');
  document.querySelectorAll('.nav-tab').forEach(function(t){t.classList.remove('active')});
}

function renderDetailView(article, vIdx) {
  var ver = article.versions[vIdx];
  var isCurrent = vIdx === article.versions.length-1;

  document.getElementById('detail-title').textContent = article.title;

  var statusArea = document.getElementById('detail-status-area');
  var si = getStatusInfo(article.status);
  var statusHtml = '<span class="status-badge '+si.cls+'">'+si.label+'</span>';
  if (article.status === 'draft') {
    statusHtml += '<button class="btn btn-coral btn-sm" id="btn-status-action">Approve</button>';
  } else if (article.status === 'approved') {
    statusHtml += '<button class="btn btn-outline btn-sm" id="btn-status-action">Publish</button>';
    statusHtml += '<button class="btn btn-outline btn-sm" id="btn-status-action2">Revert to draft</button>';
  } else if (article.status === 'published') {
    statusHtml += '<button class="btn btn-outline btn-sm" id="btn-status-action2">Revert to draft</button>';
  }
  statusArea.innerHTML = statusHtml;

  document.getElementById('detail-brief').textContent = article.brief;

  var inputsSummary = document.getElementById('detail-inputs-summary');
  if (inputsSummary) inputsSummary.innerHTML = renderArticleInputs(article);

  var rendered = document.getElementById('detail-content-rendered');
  var previewPane = document.getElementById('detail-content-preview');
  var textarea = document.getElementById('detail-content-textarea');
  var editActions = document.getElementById('detail-edit-actions');
  var customRefine = document.getElementById('detail-custom-refine');
  var toggleGroup = document.getElementById('detail-preview-toggle-group');

  rendered.innerHTML = markdownToHtml(ver.body);
  textarea.value = ver.body;
  if (previewPane) previewPane.style.display = 'none';

  var saveBtn = document.getElementById('btn-save-version');
  if (isEditing && isCurrent) {
    rendered.style.display = 'none';
    textarea.style.display = 'block';
    editActions.style.display = 'flex';
    customRefine.style.display = 'flex';
    if (toggleGroup) { toggleGroup.style.display = 'flex'; }
    // Reset to Edit tab
    var tabEdit = document.getElementById('detail-tab-edit');
    var tabPrev = document.getElementById('detail-tab-preview');
    if (tabEdit) tabEdit.classList.add('active');
    if (tabPrev) tabPrev.classList.remove('active');
    document.getElementById('btn-edit-content').textContent = 'Cancel';
    if (saveBtn) saveBtn.style.display = 'inline-flex';
  } else {
    rendered.style.display = 'block';
    textarea.style.display = 'none';
    editActions.style.display = 'none';
    customRefine.style.display = 'none';
    if (toggleGroup) toggleGroup.style.display = 'none';
    document.getElementById('btn-edit-content').textContent = 'Edit content';
    if (saveBtn) saveBtn.style.display = 'none';
  }

  renderVersionSidebar(article, vIdx);
}

function renderVersionSidebar(article, activeVIdx) {
  var html = article.versions.slice().reverse().map(function(ver, i) {
    var origIdx = article.versions.length - 1 - i;
    var isCurrent = origIdx === article.versions.length-1;
    var isActive = origIdx === activeVIdx;
    return '<div class="version-sidebar-item'+(isActive?' active':'')+'" data-v="'+ver.v+'">' +
      '<div class="vs-num"><span class="vs-dot'+(isCurrent?' current':'')+'"></span>v'+ver.v+(isCurrent?' — Current':'')+'</div>' +
      '<div class="vs-date">'+escapeHtml(ver.date)+'</div>' +
      '<div class="vs-note">'+escapeHtml(ver.note)+'</div>' +
      (ver.email ? '<div style="font-size:11px;color:var(--color-text-secondary);margin-top:2px;margin-left:14px;word-break:break-all">'+escapeHtml(ver.email)+'</div>' : '') +
      (!isCurrent ? '<button class="btn btn-outline btn-sm" style="margin-top:6px;margin-left:14px" data-restore-v="'+ver.v+'">Restore</button>' : '') +
    '</div>';
  }).join('');
  document.getElementById('version-sidebar-list').innerHTML = html;
}

function getTodayStr() {
  var d = new Date();
  var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
}

function saveNewVersion(articleId, newBody, note) {
  var article = findArticle(articleId);
  if (!article) return;
  var newV = article.versions.length + 1;
  var today = getTodayStr();
  article.versions.push({v:newV, date:today, note:note||'Manual edit', email:CURRENT_USER_EMAIL, body:newBody});
  article.date = today;
  if (article.status !== 'draft') article.status = 'draft';
}

function restoreVersion(articleId, vNum) {
  var article = findArticle(articleId);
  if (!article) return;
  var ver = null;
  for(var i=0;i<article.versions.length;i++){if(article.versions[i].v===vNum){ver=article.versions[i];break;}}
  if (!ver) return;
  var newV = article.versions.length + 1;
  var today = getTodayStr();
  article.versions.push({v:newV, date:today, note:'Restored from v'+vNum, email:CURRENT_USER_EMAIL, body:ver.body});
  article.date = today;
}

function applyRefineInstruction(body, instruction) {
  if (instruction === 'More concise') {
    var lines = body.split('\n');
    var cutIdx = -1;
    for(var i=lines.length-1;i>=0;i--){
      if(lines[i].match(/^## /)){cutIdx=i;break;}
    }
    if(cutIdx>2){lines=lines.slice(0,cutIdx);}
    return lines.join('\n');
  } else if (instruction === 'Stronger CTA') {
    return body + '\n\n## Act now\n\nOptimise your content today to capture AI citations before competitors close the gap. Brands that publish spec-rich, structured content now will dominate AI-generated shortlists within 90 days.';
  } else if (instruction === 'More technical') {
    return body + '\n\n## Technical reference\n\n| Attribute | Recommended spec | Citation impact |\n|---|---|---|\n| Stack height | 36–40mm | High |\n| Heel-to-toe drop | 4–6mm | High |\n| Outsole lifespan | 400–500km | Medium |\n| Plate material | Full carbon | High |';
  } else {
    return body + '\n\n## AI citation note\n\nThis content has been structured to maximise citation potential. Each section anchors claims to measurable data that AI models extract and surface in recommendations.';
  }
}

var msInstances = {};

function createMultiSearch(containerId, options, isMulti, placeholder, onSpecialOption, onChange) {
  var container = document.getElementById(containerId);
  if (!container) return null;
  container.innerHTML = '';
  container.className = 'ms-wrap';

  var inputArea = document.createElement('div');
  inputArea.className = 'ms-input-area';

  var searchInput = document.createElement('input');
  searchInput.type = 'text';
  searchInput.className = 'ms-search';
  searchInput.placeholder = placeholder || 'Search…';
  inputArea.appendChild(searchInput);

  var dropdown = document.createElement('div');
  dropdown.className = 'ms-dropdown';

  container.appendChild(inputArea);
  container.appendChild(dropdown);

  var selected = [];

  function renderTags() {
    inputArea.querySelectorAll('.ms-tag').forEach(function(t){t.remove()});
    selected.forEach(function(val) {
      var tag = document.createElement('span');
      tag.className = 'ms-tag';
      tag.innerHTML = escapeHtml(val) + '<button class="ms-tag-x" data-remove="'+escapeHtml(val)+'">&times;</button>';
      inputArea.insertBefore(tag, searchInput);
    });
  }

  function renderDropdown(filter) {
    var f = (filter||'').toLowerCase();
    var filtered = options.filter(function(o){return o.toLowerCase().indexOf(f)!==-1});
    if (filtered.length === 0) {
      dropdown.innerHTML = '<div class="ms-empty">No results</div>';
    } else {
      dropdown.innerHTML = filtered.map(function(o){
        var isSel = selected.indexOf(o) !== -1;
        return '<div class="ms-option'+(isSel?' selected':'')+'" data-val="'+escapeHtml(o)+'">' +
          '<span class="ms-option-check">'+(isSel?'&#10003;':'')+'</span>' +
          escapeHtml(o) +
        '</div>';
      }).join('');
    }
  }

  function openDropdown() {
    renderDropdown(searchInput.value);
    dropdown.classList.add('open');
  }

  function closeDropdown() { dropdown.classList.remove('open'); }

  function selectOption(val) {
    if (onSpecialOption && val === '+ Upload new…') {
      onSpecialOption(); closeDropdown(); return;
    }
    if (!isMulti) {
      selected = [val];
      searchInput.value = '';
      renderTags();
      closeDropdown();
    } else {
      var idx = selected.indexOf(val);
      if (idx === -1) selected.push(val);
      else selected.splice(idx, 1);
      renderTags();
      renderDropdown(searchInput.value);
    }
    if (onChange) onChange(selected.slice());
  }

  searchInput.addEventListener('focus', openDropdown);
  searchInput.addEventListener('input', function(){renderDropdown(this.value)});

  inputArea.addEventListener('click', function(e){
    var removeBtn = e.target.closest('[data-remove]');
    if (removeBtn) {
      e.stopPropagation();
      var val = removeBtn.getAttribute('data-remove');
      var idx = selected.indexOf(val);
      if (idx !== -1) { selected.splice(idx,1); renderTags(); if (onChange) onChange(selected.slice()); }
      return;
    }
    searchInput.focus();
  });

  dropdown.addEventListener('mousedown', function(e){
    e.preventDefault();
    var opt = e.target.closest('.ms-option');
    if (opt) selectOption(opt.getAttribute('data-val'));
  });

  document.addEventListener('click', function(e){
    if (!container.contains(e.target)) closeDropdown();
  });

  return {
    getSelected: function(){ return selected.slice(); },
    setSelected: function(vals){ selected = isMulti ? vals.slice() : (vals.length ? [vals[0]] : []); renderTags(); }
  };
}

// STEP 2
function renderStep2() {

// STEP 3
function runStep3() {
  var cats = modal.categories.length > 0 ? modal.categories : ['Running Shoes'];
  var prompts = [];
  cats.forEach(function(cat){
    if (PROMPTS_DATA[cat]) {
      PROMPTS_DATA[cat].forEach(function(p){ prompts.push({text:p.text,myVis:p.myVis,compAvg:p.compAvg,category:cat}); });
    }
  });
  prompts.sort(function(a,b){return (b.compAvg-b.myVis)-(a.compAvg-a.myVis)});
  modal.allPrompts = prompts;
  renderStep3Content();
  renderModalFooter();
}

function renderStep3Content() {
  var prompts = modal.allPrompts;
  var html = '<div class="prompts-header"><span class="prompts-count">'+prompts.length+' prompts found</span><div style="display:flex;gap:8px"><button class="btn btn-ghost btn-sm" id="prompts-sel-all">Select all</button><button class="btn btn-ghost btn-sm" id="prompts-desel-all">Deselect all</button></div></div>';
  prompts.forEach(function(p){
    var gap = p.compAvg - p.myVis;
    var gapCls = gap>=30?'gap-red':gap>=15?'gap-amber':'gap-green';
    var isSel = modal.selectedPrompts.indexOf(p.text)!==-1;
    html += '<div class="prompt-row'+(isSel?' selected':'')+'" data-prompt="'+escapeHtml(p.text)+'">' +
      '<div class="prompt-cb">'+(isSel?'&#10003;':'')+'</div>' +
      '<div class="prompt-text">'+escapeHtml(p.text)+'</div>' +
      '<div class="mini-bars">' +
        '<div class="mini-bar-row"><span class="mini-bar-label">You</span><div class="mini-bar-track"><div class="mini-bar-fill" style="width:'+p.myVis+'%;background:var(--coral)"></div></div><span class="mini-bar-val">'+p.myVis+'%</span></div>' +
        '<div class="mini-bar-row"><span class="mini-bar-label">Avg</span><div class="mini-bar-track"><div class="mini-bar-fill" style="width:'+p.compAvg+'%;background:var(--dark-navy)"></div></div><span class="mini-bar-val">'+p.compAvg+'%</span></div>' +
      '</div>' +
      '<span class="gap-badge '+gapCls+'">−'+gap+'pp</span>' +
    '</div>';
  });
  document.getElementById('modal-body').innerHTML = html;
}

// STEP 4
function buildAllCitations() {
  var all = [];
  modal.selectedPrompts.forEach(function(pt){
    var cits = CITATIONS_DATA[pt];
    if (cits && cits.length) {
      cits.forEach(function(c){ all.push({source:c.source,snippet:c.snippet,llms:c.llms.slice(),mine:c.mine,prompt:pt}); });
    } else {
      all.push({source:'industry-source.com',snippet:'This is a placeholder citation for this query covering key product attributes.',llms:['ChatGPT'],mine:false,prompt:pt});
      all.push({source:'research-portal.org',snippet:'Another placeholder citation with relevant consumer insights and category data.',llms:['Gemini'],mine:false,prompt:pt});
    }
  });
  modal.allCitations = all;
}

function renderStep4() {
  var needsInit = modal.allCitations.length === 0;
  buildAllCitations();
  if (needsInit) {
    modal.selectedCitations = modal.allCitations.map(function(c){return c.prompt+'|||'+c.source}).slice(0,5);
  }
  var total = modal.allCitations.length;
  var html = '<div class="opp-banner">Your brand appears in 0 of '+total+' citations across '+modal.selectedPrompts.length+' prompt'+(modal.selectedPrompts.length!==1?'s':'')+'.</div>';
  modal.selectedPrompts.forEach(function(pt){
    var cits = modal.allCitations.filter(function(c){return c.prompt===pt});
    var selCount = cits.filter(function(c){return modal.selectedCitations.indexOf(c.prompt+'|||'+c.source)!==-1}).length;
    html += '<div class="citation-group" data-cg-prompt="'+escapeHtml(pt)+'">' +
      '<div class="citation-group-header">' +
        '<span class="citation-group-prompt">'+escapeHtml(pt)+'</span>' +
        '<span class="citation-group-count">'+selCount+'/'+cits.length+' selected</span>' +
        '<span class="citation-group-chevron">&#9660;</span>' +
      '</div>' +
      '<div class="citation-items">';
    cits.forEach(function(c){
      var key = c.prompt+'|||'+c.source;
      var isSel = modal.selectedCitations.indexOf(key)!==-1;
      html += '<div class="citation-item'+(isSel?' selected':'')+'" data-cit-key="'+escapeHtml(key)+'">' +
        '<div class="citation-cb">'+(isSel?'&#10003;':'')+'</div>' +
        '<div class="favicon-circle">'+escapeHtml(c.source.charAt(0).toUpperCase())+'</div>' +
        '<div class="citation-body">' +
          '<div class="citation-domain">'+escapeHtml(c.source)+'</div>' +
          '<div class="citation-snippet">'+escapeHtml(c.snippet)+'</div>' +
          '<div class="llm-badges">'+c.llms.map(getLLMBadge).join('')+'</div>' +
          (!c.mine?'<span class="not-cited-flag">Your brand not cited</span>':'') +
        '</div>' +
      '</div>';
    });
    html += '</div></div>';
  });
  return html;
}

// STEP 5
function renderStep5() {
  var fmtOptions = [''].concat(FORMATS).map(function(f){
    return '<option value="'+f+'"'+(f===modal.format?' selected':'')+'>'+( f||'Select format…')+'</option>';
  }).join('');
  var langOptions = [''].concat(LANGUAGES).map(function(l){
    return '<option value="'+l+'"'+(l===modal.language?' selected':'')+'>'+( l||'Select language…')+'</option>';
  }).join('');
  return '<div class="form-group"><label class="form-label">Content format</label>' +
    '<select class="modal-select" id="sel-format">'+fmtOptions+'</select></div>' +
    '<div class="form-group"><label class="form-label">Language</label>' +
    '<select class="modal-select" id="sel-language">'+langOptions+'</select></div>';
}

function initStep5Selects() {}

// STEP 6
function runStep6() {
  if (!spendCredits(50)) { closeModal(); return; }
  var cats = modal.categories;
  var fmt = modal.format || 'Blog post';
  var brief = '', body = '';
  if (cats.indexOf('Running Shoes')!==-1) {
    brief = 'This article targets the highest-visibility gaps for marathon running shoe queries across ChatGPT, Gemini, and Perplexity. It structures content around the four attributes AI models cite most — stack height, drop, carbon plate geometry, and durability data — using explicit numeric claims that earn 3× higher citation rates than subjective descriptors.';
    body = '# The marathon runner’s guide to long-distance shoe performance\n\nWhen AI models answer queries about marathon shoes, a handful of performance attributes dominate every recommendation: cushioning stack height, heel-to-toe drop, carbon plate technology, and long-run durability.\n\n## What AI citations prioritise\n\nAnalysis of 2,400 AI-generated responses across ChatGPT, Perplexity, and Gemini shows that factual, spec-driven content earns citations at 3.2× the rate of opinion-based editorial. Brands that structure content around measurable claims — “38mm stack height”, “4mm drop”, “300-mile outsole durability” — consistently outrank competitors in AI-generated shortlists.\n\n## Key features to evaluate\n\n**Stack height** determines long-run cushioning. Models recommend 36–40mm for marathon distances, citing reduced fatigue after the 30km mark.\n\n**Heel-to-toe drop** affects strike pattern. A 4–6mm drop suits mid-foot strikers; zero drop requires a 12-week adaptation period that AI models frequently flag as an injury risk.\n\n**Carbon plate** options from Adidas Running and Nike Running dominate AI citation counts in the performance tier.\n\n**Durability** claims backed by kilometre data outperform subjective descriptors. “450km outsole lifespan on asphalt” converts better than “long-lasting build quality.”\n\n## Building content AI models cite\n\nStructure content with clear ## headings, explicit numeric claims, and comparison context. AI models reward content that helps users make decisions — not content that simply promotes a product.';
  } else if (cats.indexOf('Coffee Pods')!==-1) {
    brief = 'This article identifies the four citation triggers that dominate AI responses for coffee pod queries: taste specificity, machine compatibility matrices, third-party sustainability certifications, and price-per-cup transparency. It provides actionable content structures for each attribute.';
    body = '# What AI models recommend when you search for coffee pods\n\nAI models are increasingly the first stop for product research. Understanding what signals drive AI citations is how brands build durable AI visibility.\n\n## How AI evaluates coffee pod content\n\nAcross 1,800 AI-generated coffee pod recommendations, the attributes cited most frequently are: taste profile descriptions, machine compatibility data, sustainability certifications, and price-per-cup transparency.\n\n## Top-cited content attributes\n\n**Taste reviews with specificity** earn citations. “Notes of dark chocolate and dried fruit, medium acidity, intensity 9” outperforms “rich, full-bodied flavour.”\n\n**Machine compatibility** is the most-searched functional attribute. Nespresso Original versus Vertuo distinctions appear in 67% of AI responses.\n\n**Sustainability credentials** matter. Certified compostable pods are cited favourably. Certifications with third-party names drive higher citation rates.\n\n**Price-per-cup** transparency shapes perceived value. Content that states “€0.43 per pod at subscription pricing” performs better than “affordable premium coffee.”\n\n## Building content AI models cite\n\nPublish content that answers the specific questions AI models receive. State intensity ratings, origin data, and machine compatibility in the first 150 words.';
  } else {
    var catName = cats.length ? cats[0] : 'your products';
    brief = 'This article addresses the highest-visibility gaps for '+catName+' queries, providing structured, spec-driven content optimised for AI citation across all major LLMs. Each section is designed to maximise citation frequency by anchoring claims to measurable data and comparison context.';
    body = '# AI visibility guide: '+catName+'\n\nAI models are reshaping how consumers discover products. For brands in '+catName+', building AI-cited content means structuring information around the attributes these models are trained to prioritise.\n\n## What AI models prioritise\n\nAcross thousands of AI-generated responses, factual, specification-driven content consistently earns 3× more citations than opinion-based editorial. Structure your content around measurable claims.\n\n## Key content attributes\n\n**Specific product specifications** with numbers, measurements, and comparison data earn higher citation rates than vague descriptors.\n\n**Comparison context** helps AI models position your products relative to alternatives — include head-to-head data where possible.\n\n**Third-party validation** such as certifications, test data, and review scores significantly increases citation probability.\n\n**Use-case matching** ties specifications to real customer scenarios, the primary way AI models generate personalised recommendations.\n\n## Implementation strategy\n\nPublish content with clear ## headings, explicit numeric claims, and comparison tables. Refresh this content quarterly as AI model training data evolves.';
  }
  modal._generatedBrief = brief;
  modal._generatedBody = body;

  document.getElementById('modal-body').innerHTML =
    '<div class="review-three-col">' +
      '<div class="review-col-brief">' +
        '<div class="card-label">Brief</div>' +
        '<div class="review-brief-card"><p style="font-size:13px;color:var(--color-text-secondary);line-height:1.6">'+escapeHtml(brief)+'</p></div>' +
      '</div>' +
      '<div class="review-col-content">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">' +
          '<div class="card-label" style="margin-bottom:0">Content</div>' +
          '<div class="preview-toggle-group">' +
            '<button class="preview-toggle active" id="modal-tab-edit">Edit</button>' +
            '<button class="preview-toggle" id="modal-tab-preview">Preview</button>' +
          '</div>' +
        '</div>' +
        '<div id="modal-content-preview" class="article-content preview-pane" style="display:none"></div>' +
        '<textarea id="modal-content-ta" class="content-textarea" style="min-height:300px">'+escapeHtml(body)+'</textarea>' +
        '<div class="refine-pills" style="margin-top:10px">' +
          '<button class="refine-pill modal-refine-pill" data-refine="More concise">More concise</button>' +
          '<button class="refine-pill modal-refine-pill" data-refine="More technical">More technical</button>' +
          '<button class="refine-pill modal-refine-pill" data-refine="Stronger CTA">Stronger CTA</button>' +
          '<button class="refine-pill modal-refine-pill" data-refine="Optimise for AI citations">Optimise for AI citations</button>' +
        '</div>' +
        '<div class="custom-refine" style="margin-top:10px">' +
          '<input type="text" id="modal-custom-input" placeholder="Custom instruction…">' +
          '<button class="btn btn-outline btn-sm" id="modal-btn-refine">Refine</button>' +
        '</div>' +
      '</div>' +
      '<div class="review-col-inputs">' +
        '<div class="card-label">Inputs</div>' +
        '<div class="review-brief-card" style="padding:10px">'+renderInputsSummary()+'</div>' +
      '</div>' +
    '</div>';
}

function renderInputsSummary() {
  function row(label, val) {
    var display = Array.isArray(val) ? val.join(', ') : String(val || '');
    if (!display) return '';
    return '<div class="input-summary-row"><span class="input-summary-label">'+label+'</span><span class="input-summary-val">'+escapeHtml(display)+'</span></div>';
  }
  return row('Format', modal.format || 'Blog post') +
    row('Language', modal.language || 'English') +
    row('Categories', modal.categories) +
    row('Markets', modal.markets) +
    row('Personas', modal.personas) +
    row('LLMs', modal.llms) +
    row('Brand kit', modal.brandKits) +
    row('Knowledge base', modal.knowledgeBases) +
    '<div class="input-summary-row"><span class="input-summary-label">Prompts</span><span class="input-summary-val">'+modal.selectedPrompts.length+' selected</span></div>' +
    '<div class="input-summary-row"><span class="input-summary-label">Citations</span><span class="input-summary-val">'+modal.selectedCitations.length+' selected</span></div>';
}

function renderArticleInputs(article) {
  function row(label, val) {
    var display = Array.isArray(val) ? val.join(', ') : String(val || '');
    if (!display || display === '—') return '';
    return '<div class="input-summary-row"><span class="input-summary-label">'+label+'</span><span class="input-summary-val">'+escapeHtml(display)+'</span></div>';
  }
  return row('Format', article.format) +
    row('Language', article.language) +
    row('Categories', article.categories) +
    row('Markets', article.markets) +
    row('Personas', article.personas) +
    row('LLMs', article.llms);
}

function syncModalState() {
  if (modal.step===1) {
    var selCat = document.getElementById('sel-category');
    if (selCat) modal.categories = selCat.value ? [selCat.value] : [];
    if (msInstances.markets) modal.markets = msInstances.markets.getSelected();
    if (msInstances.personas) modal.personas = msInstances.personas.getSelected();
    if (msInstances.llms) modal.llms = msInstances.llms.getSelected();
  } else if (modal.step===2) {
    var selFmt = document.getElementById('sel-format');
    var selLang = document.getElementById('sel-language');
    if (selFmt) modal.format = selFmt.value;
    if (selLang) modal.language = selLang.value;
  } else if (modal.step===3) {
    if (msInstances.brandKits) modal.brandKits = msInstances.brandKits.getSelected();
    if (msInstances.knowledgeBases) modal.knowledgeBases = msInstances.knowledgeBases.getSelected();
  }
}

function approveAndSave() {
  var ta = document.getElementById('modal-content-ta');
  var body = ta ? ta.value : modal._generatedBody;
  var cats = modal.categories.length ? modal.categories : ['General'];
  var fmt = modal.format || 'Blog post';
  var lang = modal.language || 'English';
  var firstLine = body.split('\n')[0].replace(/^# /,'');
  var title = firstLine || 'AI content — ' + cats.join(', ');
  var today = getTodayStr();
  library.unshift({
    id: 'art-' + Date.now(),
    title: title,
    brief: modal._generatedBrief || '',
    format: fmt,
    categories: cats.slice(),
    markets: modal.markets.slice(),
    personas: modal.personas.slice(),
    llms: modal.llms.slice(),
    language: lang,
    status: 'draft',
    date: today,
    versions: [{v:1, date:today, note:'Initial generation', email:CURRENT_USER_EMAIL, body:body}]
  });
  closeModal();
  renderLibrary();
  showToast('Content saved to library.');
}

// ============================================================
// EVENT DELEGATION — INIT
// ============================================================
function init() {
  renderLibrary();

  // NAV TABS
  document.querySelector('.nav-tabs').addEventListener('click', function(e){
    var tab = e.target.closest('.nav-tab');
    if (!tab) return;
    var name = tab.getAttribute('data-tab');
    document.querySelectorAll('.nav-tab').forEach(function(t){t.classList.remove('active')});
    tab.classList.add('active');
    if (name==='library') showView('library');
  });

  document.getElementById('btn-gen-header').addEventListener('click', openModal);

  // LIBRARY LIST
  document.getElementById('library-list').addEventListener('click', function(e){
    if (e.target.closest('#btn-gen-empty')) { openModal(); return; }

    var row = e.target.closest('tr[data-id]');
    if (row) { openDetail(row.getAttribute('data-id')); return; }
  });

  // LIBRARY SEARCH
  document.getElementById('lib-search-input').addEventListener('input', function() {
    libSearchQuery = this.value;
    renderLibrary();
  });

  // FILTER PILLS
  document.getElementById('filter-pills').addEventListener('click', function(e){
    var pill = e.target.closest('.filter-pill');
    if (!pill) return;
    activeFilter = pill.getAttribute('data-filter');
    document.querySelectorAll('.filter-pill').forEach(function(p){p.classList.remove('active')});
    pill.classList.add('active');
    renderLibrary();
  });

  // BACK BUTTON
  document.getElementById('btn-back').addEventListener('click', function(){
    isEditing = false; currentDetailId = null;
    showView('library'); renderLibrary();
    document.querySelectorAll('.nav-tab').forEach(function(t){t.classList.remove('active')});
    document.querySelector('[data-tab="library"]').classList.add('active');
  });

  // DETAIL EDIT BUTTON
  document.getElementById('btn-edit-content').addEventListener('click', function(){
    if (!currentDetailId) return;
    var article = findArticle(currentDetailId);
    if (!article) return;
    var isCurrent = currentDetailVersion === article.versions.length-1;
    if (!isCurrent) { showToast('Switch to the current version to edit.'); return; }
    isEditing = !isEditing;
    renderDetailView(article, currentDetailVersion);
  });

  // SAVE BUTTON (header)
  document.getElementById('btn-save-version').addEventListener('click', function(){
    var ta = document.getElementById('detail-content-textarea');
    if (!ta || !currentDetailId) return;
    saveNewVersion(currentDetailId, ta.value, 'Manual edit');
    var article = findArticle(currentDetailId);
    currentDetailVersion = article.versions.length-1;
    isEditing = false;
    renderDetailView(article, currentDetailVersion);
    showToast('New version saved.');
  });

  // DETAIL CONTENT CARD ACTIONS
  document.getElementById('detail-content-card').addEventListener('click', function(e){
    var refinePill = e.target.closest('#detail-refine-pills .refine-pill');
    if (refinePill) {
      if (!spendCredits(10, true)) return;
      var instruction = refinePill.getAttribute('data-refine');
      var ta = document.getElementById('detail-content-textarea');
      if (!ta) return;
      var newBody = applyRefineInstruction(ta.value, instruction);
      saveNewVersion(currentDetailId, newBody, 'Refined: '+instruction);
      var article = findArticle(currentDetailId);
      currentDetailVersion = article.versions.length-1;
      renderDetailView(article, currentDetailVersion);
      showToast('Content refined and saved · 10 credits used', 'success');
      return;
    }
    if (e.target.closest('#btn-detail-refine')) {
      var input = document.getElementById('detail-custom-input');
      if (!input || !input.value.trim()) return;
      if (!spendCredits(10, true)) return;
      var ta = document.getElementById('detail-content-textarea');
      var newBody = applyRefineInstruction(ta ? ta.value : '', input.value.trim());
      saveNewVersion(currentDetailId, newBody, 'Refined: '+input.value.trim());
      var article = findArticle(currentDetailId);
      currentDetailVersion = article.versions.length-1;
      renderDetailView(article, currentDetailVersion);
      input.value = '';
      showToast('Content refined and saved · 10 credits used', 'success');
    }

    // Detail preview/edit toggle (only visible in edit mode)
    if (e.target.closest('#detail-tab-preview')) {
      var ta = document.getElementById('detail-content-textarea');
      var preview = document.getElementById('detail-content-preview');
      if (ta && preview) {
        preview.innerHTML = markdownToHtml(ta.value);
        ta.style.display = 'none';
        preview.style.display = 'block';
        document.getElementById('detail-tab-preview').classList.add('active');
        document.getElementById('detail-tab-edit').classList.remove('active');
      }
      return;
    }
    if (e.target.closest('#detail-tab-edit')) {
      var ta = document.getElementById('detail-content-textarea');
      var preview = document.getElementById('detail-content-preview');
      if (ta && preview) {
        ta.style.display = 'block';
        preview.style.display = 'none';
        document.getElementById('detail-tab-edit').classList.add('active');
        document.getElementById('detail-tab-preview').classList.remove('active');
      }
      return;
    }
  });

  // DETAIL STATUS AREA
  document.getElementById('detail-status-area').addEventListener('click', function(e){
    if (!currentDetailId) return;
    var article = findArticle(currentDetailId);
    if (!article) return;
    if (e.target.closest('#btn-status-action')) {
      var next = {draft:'approved', approved:'published'};
      article.status = next[article.status] || article.status;
      renderDetailView(article, currentDetailVersion);
      renderLibrary();
      showToast('Status updated to ' + getStatusInfo(article.status).label, 'success');
    }
    if (e.target.closest('#btn-status-action2')) {
      article.status = 'draft';
      renderDetailView(article, currentDetailVersion);
      renderLibrary();
      showToast('Reverted to Draft', 'success');
    }
  });

  // VERSION SIDEBAR
  document.getElementById('version-sidebar-list').addEventListener('click', function(e){
    var restoreBtn = e.target.closest('[data-restore-v]');
    if (restoreBtn && currentDetailId) {
      restoreVersion(currentDetailId, parseInt(restoreBtn.getAttribute('data-restore-v')));
      var article = findArticle(currentDetailId);
      currentDetailVersion = article.versions.length-1;
      isEditing = false;
      renderDetailView(article, currentDetailVersion);
      showToast('Version restored.');
      return;
    }
    var item = e.target.closest('.version-sidebar-item');
    if (item && currentDetailId) {
      var v = parseInt(item.getAttribute('data-v'));
      var article = findArticle(currentDetailId);
      if (!article) return;
      var vIdx = -1;
      for(var i=0;i<article.versions.length;i++){if(article.versions[i].v===v){vIdx=i;break;}}
      if (vIdx===-1) return;
      currentDetailVersion = vIdx;
      isEditing = false;
      renderDetailView(article, vIdx);
    }
  });

  // MODAL CLOSE
  document.getElementById('modal-close-btn').addEventListener('click', closeModal);
  document.getElementById('modal-backdrop').addEventListener('click', function(e){ if(e.target===this)closeModal(); });

  // MODAL FOOTER
  document.getElementById('modal-footer').addEventListener('click', function(e){
    if (e.target.closest('#modal-btn-back')) {
      syncModalState(); modal.step--; renderModal(); return;
    }
    if (e.target.closest('#modal-btn-next')) {
      syncModalState();
      // Validate step 1
      if (modal.step===1 && modal.categories.length===0) { showToast('Please select at least one product category.'); return; }
      if (modal.step===4) { modal.allCitations = []; modal.selectedCitations = []; }
      modal.step++; renderModal(); return;
    }
    if (e.target.closest('#modal-btn-approve')) { approveAndSave(); return; }
    if (e.target.closest('#modal-btn-deselall')) {
      modal.selectedCitations = [];
      document.getElementById('modal-body').innerHTML = renderStep4();
      renderModalFooter(); return;
    }
  });

  // MODAL BODY
  document.getElementById('modal-body').addEventListener('click', function(e){
    // Prompt row toggle
    var promptRow = e.target.closest('.prompt-row');
    if (promptRow) {
      var txt = promptRow.getAttribute('data-prompt');
      var idx = modal.selectedPrompts.indexOf(txt);
      if (idx===-1) modal.selectedPrompts.push(txt); else modal.selectedPrompts.splice(idx,1);
      promptRow.classList.toggle('selected');
      var cb = promptRow.querySelector('.prompt-cb');
      if (cb) cb.innerHTML = promptRow.classList.contains('selected')?' &#10003;':'';
      renderModalFooter(); return;
    }

    // Prompt select/deselect all
    if (e.target.closest('#prompts-sel-all')) {
      modal.selectedPrompts = modal.allPrompts.map(function(p){return p.text});
      renderStep3Content(); renderModalFooter(); return;
    }
    if (e.target.closest('#prompts-desel-all')) {
      modal.selectedPrompts = []; renderStep3Content(); renderModalFooter(); return;
    }

    // Citation item toggle
    var citItem = e.target.closest('.citation-item');
    if (citItem) {
      var key = citItem.getAttribute('data-cit-key');
      var idx = modal.selectedCitations.indexOf(key);
      if (idx===-1) {
        if (modal.selectedCitations.length >= 5) { showToast('Maximum 5 citations allowed.'); return; }
        modal.selectedCitations.push(key);
      } else {
        modal.selectedCitations.splice(idx,1);
      }
      citItem.classList.toggle('selected');
      var cb = citItem.querySelector('.citation-cb');
      if (cb) cb.innerHTML = citItem.classList.contains('selected')?'&#10003;':'';
      var grp = citItem.closest('.citation-group');
      if (grp) {
        var total = grp.querySelectorAll('.citation-item').length;
        var sel = grp.querySelectorAll('.citation-item.selected').length;
        var cntEl = grp.querySelector('.citation-group-count');
        if (cntEl) cntEl.textContent = sel+'/'+total+' selected';
      }
      renderModalFooter(); return;
    }

    // Citation group collapse toggle
    var cgHeader = e.target.closest('.citation-group-header');
    if (cgHeader) {
      var grp = cgHeader.closest('.citation-group');
      grp.classList.toggle('collapsed');
      var items = grp.querySelector('.citation-items');
      if (items) items.style.display = grp.classList.contains('collapsed')?'none':'block';
      return;
    }

    // Modal refine pills (step 6)
    var modalRefinePill = e.target.closest('.modal-refine-pill');
    if (modalRefinePill) {
      if (!spendCredits(10, true)) return;
      var instruction = modalRefinePill.getAttribute('data-refine');
      var ta = document.getElementById('modal-content-ta');
      if (ta) {
        ta.value = applyRefineInstruction(ta.value, instruction);
        modal._generatedBody = ta.value;
        showToast('Content refined · 10 credits used', 'success');
      }
      return;
    }

    // Modal custom refine
    if (e.target.closest('#modal-btn-refine')) {
      var input = document.getElementById('modal-custom-input');
      if (input && input.value.trim()) {
        if (!spendCredits(10, true)) return;
        var ta = document.getElementById('modal-content-ta');
        if (ta) {
          ta.value = applyRefineInstruction(ta.value, input.value.trim());
          modal._generatedBody = ta.value;
          showToast('Content refined · 10 credits used', 'success');
        }
        input.value = '';
      }
    }

    // Modal preview/edit toggle
    if (e.target.closest('#modal-tab-preview')) {
      var ta = document.getElementById('modal-content-ta');
      var preview = document.getElementById('modal-content-preview');
      if (ta && preview) {
        preview.innerHTML = markdownToHtml(ta.value);
        ta.style.display = 'none';
        preview.style.display = 'block';
        document.getElementById('modal-tab-preview').classList.add('active');
        document.getElementById('modal-tab-edit').classList.remove('active');
      }
      return;
    }
    if (e.target.closest('#modal-tab-edit')) {
      var ta = document.getElementById('modal-content-ta');
      var preview = document.getElementById('modal-content-preview');
      if (ta && preview) {
        ta.style.display = 'block';
        preview.style.display = 'none';
        document.getElementById('modal-tab-edit').classList.add('active');
        document.getElementById('modal-tab-preview').classList.remove('active');
      }
      return;
    }
  });
}

init();
</script>
